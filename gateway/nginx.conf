worker_processes auto;
events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format json escape=json
    '{"ts":"$time_iso8601","remote":"$remote_addr","host":"$host","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"upstream":"$upstream_addr",'
    '"rt":$request_time}';
  access_log /dev/stdout json;

  limit_req_zone $binary_remote_addr zone=edge:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=s3zone:10m rate=50r/s;
  limit_req_status 429;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_prefer_server_ciphers off;

  upstream api_upstream { server api:3000; }
  upstream notifier_upstream { server notifier:3001; }
  upstream keycloak_upstream { server keycloak:8080; }
  upstream storage_upstream { server storage:8333; }

  server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /healthz {
      add_header Content-Type application/json;
      return 200 '{"gateway":"up"}';
    }

    location / {
      return 444;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name app.localhost;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    root /usr/share/nginx/web;

    # Tokens live in JS memory, so XSS = token theft. CSP is the main mitigation:
    # only our own scripts run, and fetch() may only reach our own hosts.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://auth.localhost https://api.localhost https://s3.localhost; img-src 'self' https://s3.localhost; frame-ancestors 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control no-cache always;

    location / {
      limit_req zone=edge burst=20 nodelay;
      try_files $uri /index.html;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name auth.localhost;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
      limit_req zone=edge burst=20 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_pass http://keycloak_upstream;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name api.localhost;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
      limit_req zone=edge burst=20 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_pass http://api_upstream;
    }

    # Live events (SSE) are served by the notifier, under the api host so the browser
    # talks to one api origin.
    location = /v1/events {
      limit_req zone=edge burst=20 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;      # flush every event at once instead of collecting a buffer
      proxy_read_timeout 1h;    # the stream is idle between events (heartbeat every 25 s)
      proxy_pass http://notifier_upstream;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name s3.localhost;
    client_max_body_size 220m;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    add_header X-Content-Type-Options nosniff always;

    location / {
      limit_req zone=s3zone burst=100 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_request_buffering off;
      proxy_pass http://storage_upstream;
    }
  }
}
