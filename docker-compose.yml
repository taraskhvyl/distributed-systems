name: mediashare

# The map of the stack: networks, volumes, and which file holds which tier.
# Each tier is its own file under compose/; `docker compose ...` and `make ...` work unchanged.
# project_directory: . keeps paths (./infra/..., build contexts) and .env relative to the repo root.
include:
  - { path: compose/data.yml, project_directory: . }            # postgres, redis, kafka, storage
  - { path: compose/edge.yml, project_directory: . }            # gateway, ratelimit, web, keycloak
  - { path: compose/apps.yml, project_directory: . }            # api, processor, notifier
  - { path: compose/observability.yml, project_directory: . }   # lgtm (traces + logs)
  - { path: compose/tools.yml, project_directory: . }           # opt-in: kafka-ui, k6

networks:
  edge:
    name: mediashare-edge
  data:
    name: mediashare-data
  # The SSE gateway's back side: only redis (live events) and lgtm (telemetry). The
  # gateway faces the internet, so it must not share a network with kafka or postgres.
  sse:
    name: mediashare-sse
  # Only the gateway and lgtm: lets the edge export spans without reaching redis, kafka or
  # postgres (same idea as `sse` for the sse-gateway).
  telemetry:
    name: mediashare-telemetry
  # Only k6 and the gateway. The fixed subnet is what the rate-limit rules exempt from
  # per-IP limits (infra/ratelimit/config.yaml), so it must match there.
  loadtest:
    name: mediashare-loadtest
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
  weeddata:
  kafkadata:
