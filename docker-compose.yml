name: mediashare

# Shared values, defined once and referenced below (YAML anchors).
# Repeated in infra/gateway/envoy.yaml (CSP, CORS on edge replies): change both.
x-web-origin: &web-origin https://app.localhost

# Token verification settings for every service that checks Keycloak JWTs.
# The gateway's jwt_authn repeats issuer + JWKS URL (infra/gateway/envoy.yaml): change both.
x-auth-env: &auth-env
  AUTH_ISSUER: https://auth.localhost/realms/media
  AUTH_JWKS_URL: http://keycloak:8080/realms/media/protocol/openid-connect/certs
  WEB_ORIGIN: *web-origin

# OpenTelemetry, zero-code: the SDK reads everything from env. Each service adds its own
# OTEL_SERVICE_NAME. If lgtm is down, the SDK drops spans; the app keeps working.
x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf

# Node services: the ESM loader hook must be registered before the app imports pg/kafkajs,
# or the ESM `import` bypasses the patching (require hooks only see CommonJS `require`).
x-node-otel-env: &node-otel-env
  <<: *otel-env
  NODE_OPTIONS: >-
    --experimental-loader=@opentelemetry/instrumentation/hook.mjs
    --import=@opentelemetry/auto-instrumentations-node/register
  # Only what we use; the default set also traces fs/dns/net and floods every trace.
  OTEL_NODE_ENABLED_INSTRUMENTATIONS: http,pg,ioredis,kafkajs,pino
  # Skip cloud detectors (GCP/AWS): they probe metadata endpoints and warn on every start.
  OTEL_NODE_RESOURCE_DETECTORS: env,host,os

networks:
  edge:
    name: mediashare-edge
  data:
    name: mediashare-data
  # Only k6 and the gateway. The fixed subnet is what the rate-limit rules exempt from
  # per-IP limits (infra/ratelimit/config.yaml), so it must match there.
  loadtest:
    name: mediashare-loadtest
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
  weeddata:
  kafkadata:

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mediashare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?}
      PROCESSOR_DB_PASSWORD: ${PROCESSOR_DB_PASSWORD:?}
    networks: [data]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mediashare"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: "5L6g3nShU-eOUt-eUcOMLg"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks: [data]
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    networks: [data]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic file-events --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic file-events-retry --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic file-events-dlq --partitions 1 --replication-factor 1 --config retention.ms=604800000 &&
        echo 'kafka topics provisioned'
    restart: "no"

  # Opt-in dashboard (profile `tools`): `make kafka-ui` → http://127.0.0.1:8080.
  # On the data network only and bound to loopback, NOT routed through the gateway: a Kafka
  # admin UI can read every message, so it must never be reachable from outside this machine.
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    profiles: [tools]
    depends_on:
      kafka:
        condition: service_healthy
    networks: [data]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: mediashare
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_READONLY: "true" # browse only: no producing, no deleting topics

  # Tracing/logs backend: OTel collector + Tempo + Loki + Prometheus + Grafana in one image
  # (~1 GB RAM). Always on, so a trace exists when a bug happens, not only after we start
  # looking. Grafana (anonymous admin) is loopback-only, like kafka-ui: http://127.0.0.1:3000.
  # No volume: recreating the container drops old telemetry, fine for a lab.
  # Nothing depends_on it on purpose: telemetry must never block the app from starting.
  lgtm:
    image: grafana/otel-lgtm:0.34.0
    networks: [data]
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  storage:
    image: chrislusf/seaweedfs:4.47
    user: seaweed
    networks: [edge, data]
    volumes:
      - weeddata:/data
    environment:
      S3_EXTERNAL_URL: https://s3.localhost
      WEB_ORIGIN: *web-origin
      S3_ADMIN_ACCESS_KEY: ${S3_ADMIN_ACCESS_KEY:?}
      S3_ADMIN_SECRET_KEY: ${S3_ADMIN_SECRET_KEY:?}
      S3_API_ACCESS_KEY: ${S3_API_ACCESS_KEY:?}
      S3_API_SECRET_KEY: ${S3_API_SECRET_KEY:?}
      S3_PROCESSOR_ACCESS_KEY: ${S3_PROCESSOR_ACCESS_KEY:?}
      S3_PROCESSOR_SECRET_KEY: ${S3_PROCESSOR_SECRET_KEY:?}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3-identities.json <<EOF
        {"identities": [
          {"name": "anonymous", "actions": ["Read:media-thumbnails"]},
          {"name": "api-svc", "credentials": [{"accessKey": "$$S3_API_ACCESS_KEY", "secretKey": "$$S3_API_SECRET_KEY"}], "actions": ["Read:media-uploads", "Write:media-uploads", "Write:media-thumbnails"]},
          {"name": "processor-svc", "credentials": [{"accessKey": "$$S3_PROCESSOR_ACCESS_KEY", "secretKey": "$$S3_PROCESSOR_SECRET_KEY"}], "actions": ["Read:media-uploads", "Write:media-uploads", "Write:media-thumbnails"]},
          {"name": "root-admin", "credentials": [{"accessKey": "$$S3_ADMIN_ACCESS_KEY", "secretKey": "$$S3_ADMIN_SECRET_KEY"}], "actions": ["Admin", "Read", "List", "Write", "Tagging"]}
        ]}
        EOF
        # -s3.allowedOrigins: CORS for browser uploads (presigned PUT from app.localhost).
        # The default "*" reflects ANY Origin; AWS S3 (no bucket CORS rule) rejects every preflight.
        exec weed mini -dir=/data -bucket=media-uploads,media-thumbnails -s3.config=/tmp/s3-identities.json -s3.allowedOrigins="$$WEB_ORIGIN"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9333/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: auth.localhost
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    networks: [edge]
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/media HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/node.Dockerfile
      args: { SERVICE: api }
    networks: [edge, data]
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://api_user:${API_DB_PASSWORD:?}@postgres:5432/mediashare
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
      KAFKA_BROKERS: kafka:9092
      # One merge key per mapping in YAML, so both anchors go in one list.
      <<: [*auth-env, *node-otel-env]
      S3_ENDPOINT_INTERNAL: http://storage:8333
      S3_ENDPOINT_PUBLIC: https://s3.localhost
      S3_ACCESS_KEY: ${S3_API_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_API_SECRET_KEY:?}
      S3_UPLOADS_BUCKET: media-uploads
      S3_THUMBNAILS_BUCKET: media-thumbnails
      OTEL_SERVICE_NAME: api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  processor:
    build: ./apps/processor
    networks: [data]
    environment:
      DATABASE_URL: postgres://processor_user:${PROCESSOR_DB_PASSWORD:?}@postgres:5432/mediashare
      KAFKA_BROKERS: kafka:9092
      S3_ENDPOINT: http://storage:8333
      S3_ACCESS_KEY: ${S3_PROCESSOR_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_PROCESSOR_SECRET_KEY:?}
      S3_UPLOADS_BUCKET: media-uploads
      S3_THUMBNAILS_BUCKET: media-thumbnails
      TOPIC_MAIN: file-events
      TOPIC_RETRY: file-events-retry
      TOPIC_DLQ: file-events-dlq
      <<: *otel-env
      OTEL_SERVICE_NAME: processor
      # Adds otelTraceID/otelSpanID to every LogRecord (read by log.JsonFormatter).
      OTEL_PYTHON_LOG_CORRELATION: "true"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      storage:
        condition: service_healthy
    restart: unless-stopped

  notifier:
    build:
      context: .
      dockerfile: apps/node.Dockerfile
      args: { SERVICE: notifier }
    # edge: serves the browser's SSE stream via the gateway and fetches Keycloak's JWKS.
    # This makes the notifier internet-facing (see docs/SECURITY.md).
    networks: [edge, data]
    environment:
      PORT: "3001"
      <<: [*auth-env, *node-otel-env]
      KAFKA_BROKERS: kafka:9092
      TOPIC_MAIN: file-events
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      OTEL_SERVICE_NAME: notifier
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Edge gateway (Envoy): TLS, host routing, security headers, per-IP limits via the
  # ratelimit service. The only service with a published port. Config: infra/gateway/envoy.yaml.
  gateway:
    image: envoyproxy/envoy:v1.39.1
    environment:
      # Run as root, like nginx's master did: server.key is 0600 on the host mount and the
      # default envoy user (uid 101) can't read it. Production gets certs via SDS/secrets.
      ENVOY_UID: "0"
    networks:
      edge: {}
      # The public host names resolve to the gateway only inside this network, so k6
      # reaches it directly with its own IP instead of the host's shared one.
      loadtest:
        aliases: [api.localhost, auth.localhost, s3.localhost]
    ports:
      - "443:443"
    volumes:
      - ./infra/gateway/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./infra/gateway/certs:/certs:ro
    depends_on:
      api:
        condition: service_started
      notifier:
        condition: service_started
      web:
        condition: service_started
      ratelimit:
        condition: service_started
      keycloak:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      # The image has no curl/wget; ask Envoy's loopback admin API with bash's /dev/tcp.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9901 && printf \"GET /ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q LIVE <&3'"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Serves the static browser app (apps/web) to the gateway; Envoy doesn't serve files.
  # Stock nginx with its default config, on edge only. In production: a CDN or a bucket.
  web:
    image: nginx:1.30-alpine
    networks: [edge]
    volumes:
      - ./apps/web:/usr/share/nginx/html:ro
    restart: unless-stopped

  # Global rate limiting for the gateway: Envoy asks it (gRPC) per request; counters live
  # in Redis, so all gateway replicas share one limit. Rules: infra/ratelimit/config.yaml.
  # On edge (reached by the gateway) and data (reaches Redis); the gateway itself stays
  # edge-only and never touches Redis.
  ratelimit:
    image: envoyproxy/ratelimit:0482748e
    command: ["/bin/ratelimit"]
    networks: [edge, data]
    environment:
      USE_STATSD: "false"
      LOG_LEVEL: warn
      GRPC_PORT: "8081"
      REDIS_SOCKET_TYPE: tcp
      REDIS_URL: redis:6379
      REDIS_AUTH: ${REDIS_PASSWORD:?}
      RUNTIME_ROOT: /data
      RUNTIME_SUBDIRECTORY: ratelimit
      RUNTIME_WATCH_ROOT: "false"
    volumes:
      - ./infra/ratelimit/config.yaml:/data/ratelimit/config/config.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Load generator (opt-in: make loadtest). Talks only to the gateway, like an outside
  # client: TLS, routing and the per-user token bucket are in the path. Its own network
  # gives it its own IP, which is exempt from the per-IP limit (it stands in for many
  # clients). Not on edge/data: it must not see anything a real client couldn't.
  k6:
    image: grafana/k6:2.3.0
    profiles: [loadtest]
    networks: [loadtest]
    volumes:
      - ./tools/loadtest:/scripts:ro
      - ./tools/demo/samples:/samples:ro
    environment:
      VUS: ${VUS:-20}
      LOADTEST_USERS: ${LOADTEST_USERS:-50}
      # setup() creates the loadtest users through Keycloak's admin API (idempotent).
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
    command: ["run", "/scripts/baseline.js"]

