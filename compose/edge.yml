# Part of the stack; included by ../docker-compose.yml (networks and volumes are defined there).
# Edge tier: what the internet reaches through :443, plus identity.

services:
  # Edge gateway (Envoy): TLS, host routing, security headers, per-IP limits via the
  # ratelimit service. The only service with a published port. Config: infra/gateway/envoy.yaml.
  gateway:
    image: envoyproxy/envoy:v1.39.1
    environment:
      # Run as root, like nginx's master did: server.key is 0600 on the host mount and the
      # default envoy user (uid 101) can't read it. Production gets certs via SDS/secrets.
      ENVOY_UID: "0"
    networks:
      edge: {}
      # Span export only (OTLP to lgtm); the gateway still can't reach data.
      telemetry: {}
      # The public host names resolve to the gateway only inside this network, so k6
      # reaches it directly with its own IP instead of the host's shared one.
      loadtest:
        aliases: [api.localhost, auth.localhost, s3.localhost]
    ports:
      - "443:443"
    volumes:
      - ./infra/gateway/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./infra/gateway/certs:/certs:ro
    depends_on:
      api:
        condition: service_started
      sse-gateway:
        condition: service_started
      web:
        condition: service_started
      ratelimit:
        condition: service_started
      keycloak:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      # The image has no curl/wget; ask Envoy's loopback admin API with bash's /dev/tcp.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9901 && printf \"GET /ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q LIVE <&3'"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Serves the browser app to the gateway; Envoy doesn't serve files. The image builds
  # apps/web with Vite and copies dist/ into stock nginx (apps/web.Dockerfile). On edge only.
  # In production: a CDN or a bucket. After a UI change: docker compose up -d --build web
  web:
    build: { context: ., dockerfile: apps/web.Dockerfile }
    networks: [edge]
    restart: unless-stopped

  # Global rate limiting for the gateway: Envoy asks it (gRPC) per request; counters live
  # in Redis, so all gateway replicas share one limit. Rules: infra/ratelimit/config.yaml.
  # On edge (reached by the gateway) and data (reaches Redis); the gateway itself stays
  # edge-only and never touches Redis.
  ratelimit:
    image: envoyproxy/ratelimit:0482748e
    command: ["/bin/ratelimit"]
    networks: [edge, data]
    environment:
      USE_STATSD: "false"
      LOG_LEVEL: warn
      GRPC_PORT: "8081"
      REDIS_SOCKET_TYPE: tcp
      REDIS_URL: redis:6379
      REDIS_AUTH: ${REDIS_PASSWORD:?}
      RUNTIME_ROOT: /data
      RUNTIME_SUBDIRECTORY: ratelimit
      RUNTIME_WATCH_ROOT: "false"
    volumes:
      - ./infra/ratelimit/config.yaml:/data/ratelimit/config/config.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: auth.localhost
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    networks: [edge]
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/media HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
