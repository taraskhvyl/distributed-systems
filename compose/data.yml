# Part of the stack; included by ../docker-compose.yml (networks and volumes are defined there).
# Data tier: everything on the `data` network that stores state.

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mediashare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?}
      PROCESSOR_DB_PASSWORD: ${PROCESSOR_DB_PASSWORD:?}
    networks: [data]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mediashare"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: "5L6g3nShU-eOUt-eUcOMLg"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks: [data]
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    networks: [data]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic file-events --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic file-events-retry --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic file-events-dlq --partitions 1 --replication-factor 1 --config retention.ms=604800000 &&
        echo 'kafka topics provisioned'
    restart: "no"

  storage:
    image: chrislusf/seaweedfs:4.47
    user: seaweed
    networks: [edge, data]
    volumes:
      - weeddata:/data
    env_file: [compose/env/web-origin.env] # WEB_ORIGIN: the only origin allowed by S3 CORS
    environment:
      S3_EXTERNAL_URL: https://s3.localhost
      S3_ADMIN_ACCESS_KEY: ${S3_ADMIN_ACCESS_KEY:?}
      S3_ADMIN_SECRET_KEY: ${S3_ADMIN_SECRET_KEY:?}
      S3_API_ACCESS_KEY: ${S3_API_ACCESS_KEY:?}
      S3_API_SECRET_KEY: ${S3_API_SECRET_KEY:?}
      S3_PROCESSOR_ACCESS_KEY: ${S3_PROCESSOR_ACCESS_KEY:?}
      S3_PROCESSOR_SECRET_KEY: ${S3_PROCESSOR_SECRET_KEY:?}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3-identities.json <<EOF
        {"identities": [
          {"name": "anonymous", "actions": ["Read:media-thumbnails"]},
          {"name": "api-svc", "credentials": [{"accessKey": "$$S3_API_ACCESS_KEY", "secretKey": "$$S3_API_SECRET_KEY"}], "actions": ["Read:media-uploads", "Write:media-uploads", "Write:media-thumbnails"]},
          {"name": "processor-svc", "credentials": [{"accessKey": "$$S3_PROCESSOR_ACCESS_KEY", "secretKey": "$$S3_PROCESSOR_SECRET_KEY"}], "actions": ["Read:media-uploads", "Write:media-uploads", "Write:media-thumbnails"]},
          {"name": "root-admin", "credentials": [{"accessKey": "$$S3_ADMIN_ACCESS_KEY", "secretKey": "$$S3_ADMIN_SECRET_KEY"}], "actions": ["Admin", "Read", "List", "Write", "Tagging"]}
        ]}
        EOF
        # -s3.allowedOrigins: CORS for browser uploads (presigned PUT from app.localhost).
        # The default "*" reflects ANY Origin; AWS S3 (no bucket CORS rule) rejects every preflight.
        exec weed mini -dir=/data -bucket=media-uploads,media-thumbnails -s3.config=/tmp/s3-identities.json -s3.allowedOrigins="$$WEB_ORIGIN"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9333/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
