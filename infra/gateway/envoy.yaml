# Edge gateway: TLS, host routing, security headers, per-IP rate limits (via the global
# rate-limit service, infra/ratelimit/config.yaml), Keycloak JWT validation for the api host.
#
# nginx → Envoy vocabulary: server_name/location = virtual_hosts/routes,
# upstream = cluster, add_header = response_headers_to_add, limit_req = rate_limits.

# Admin API (stats, config dump, /ready) on loopback only: never reachable from outside.
admin:
  address: { socket_address: { address: 127.0.0.1, port_value: 9901 } }

static_resources:
  listeners:
    - name: https
      address: { socket_address: { address: 0.0.0.0, port_value: 443 } }
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                alpn_protocols: [h2, http/1.1]
                tls_params: { tls_minimum_protocol_version: TLSv1_2 }
                # One certificate names every host (tools/scripts/gen-certs.sh).
                tls_certificates:
                  - certificate_chain: { filename: /certs/server.crt }
                    private_key: { filename: /certs/server.key }
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: https
                # We are the edge: the TCP peer is the client, so trust it (not an incoming
                # X-Forwarded-For) and set X-Forwarded-For / -Proto for the services.
                use_remote_address: true
                # Envoy's own 429s (rate-limit service) carry no Retry-After, and clients back off
                # by it. Every edge limit is a one-second window (infra/ratelimit/config.yaml), so
                # "1" is exact. Applies to local replies only; the api's 429 keeps its own value.
                local_reply_config:
                  mappers:
                    - filter:
                        status_code_filter:
                          comparison: { op: EQ, value: { default_value: 429, runtime_key: edge_429 } }
                      headers_to_add:
                        - header: { key: Retry-After, value: "1" }
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        # Same fields as the old nginx log, plus Envoy's response flags
                        # (RL = rate limited, UH = no healthy upstream, UT = timeout).
                        json_format:
                          ts: "%START_TIME%"
                          remote: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
                          host: "%REQ(:AUTHORITY)%"
                          method: "%REQ(:METHOD)%"
                          uri: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          status: "%RESPONSE_CODE%"
                          bytes: "%BYTES_SENT%"
                          upstream: "%UPSTREAM_HOST%"
                          rt_ms: "%DURATION%"
                          flags: "%RESPONSE_FLAGS%"
                          # Why Envoy answered itself, e.g. jwt_authn_access_denied{Jwt_is_missing}.
                          details: "%RESPONSE_CODE_DETAILS%"
                http_filters:
                  # Rate limits run in two stages (a route's rate_limits entry picks one by
                  # `stage`). Stage 0, per IP: before the JWT check, so junk-token floods are
                  # capped before we pay for signature checks.
                  - name: envoy.filters.http.ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ratelimit.v3.RateLimit
                      domain: gateway
                      stage: 0
                      # Fail open, like the api's Redis bucket: if the rate-limit service is
                      # down, traffic flows unlimited rather than the whole edge failing.
                      failure_mode_deny: false
                      timeout: 0.25s
                      rate_limit_service:
                        transport_api_version: V3
                        grpc_service: { envoy_grpc: { cluster_name: ratelimit } }
                  # Validates Keycloak access tokens at the edge: a missing or bad token gets
                  # its 401 here and never reaches a service.
                  # Off by default; only hosts that opt in (typed_per_filter_config) require it.
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        keycloak:
                          # Same values as the x-auth-env anchor in docker-compose.yml (Envoy
                          # can't read compose env). Change both together.
                          issuer: https://auth.localhost/realms/media
                          remote_jwks:
                            http_uri:
                              uri: http://keycloak:8080/realms/media/protocol/openid-connect/certs
                              cluster: keycloak
                              timeout: 1s
                            # Like the services' JWKS cache: keys are fetched once, not per request.
                            # async_fetch loads them at startup, so the first request isn't slowed.
                            cache_duration: 600s
                            async_fetch: {}
                          clock_skew_seconds: 5
                          # Keep the Authorization header: the services verify the token too
                          # (defense in depth, docs/adr/0003-jwt-verified-at-edge-and-in-services.md).
                          forward: true
                          # Verified claims go to dynamic metadata; the per-user limit reads `sub`.
                          payload_in_metadata: jwt_payload
                      requirement_map:
                        keycloak: { provider_name: keycloak }
                      # A CORS preflight never carries the token (it asks whether sending one is
                      # allowed); 401'ing it would break every browser call.
                      bypass_cors_preflight: true
                  # Stage 1, per user: after jwt_authn, because `sub` exists only once the token
                  # is verified. Same service and fail-open policy as stage 0.
                  - name: envoy.filters.http.ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ratelimit.v3.RateLimit
                      domain: gateway
                      stage: 1
                      failure_mode_deny: false
                      timeout: 0.25s
                      rate_limit_service:
                        transport_api_version: V3
                        grpc_service: { envoy_grpc: { cluster_name: ratelimit } }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  virtual_hosts:
                    - name: app
                      domains: [app.localhost, "app.localhost:443"]
                      response_headers_to_add:
                        # Tokens live in JS memory, so XSS = token theft. CSP is the main
                        # mitigation: only our own scripts run, and fetch() may only reach
                        # our own hosts. Inline *styles* are allowed: Radix (dialog scroll
                        # lock) and sonner (toasts) inject <style> tags with computed values,
                        # so hashes can't cover them. Scripts stay 'self' only (ADR 0004).
                        - header:
                            key: Content-Security-Policy
                            value: "default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://auth.localhost https://api.localhost https://s3.localhost; img-src 'self' https://s3.localhost; frame-ancestors 'none'; base-uri 'none'"
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                        - header: { key: Cache-Control, value: no-cache }
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                        # Shared with the other hosts below: defined once here as YAML
                        # anchors (&name), reused as aliases (*name). Envoy has no includes.
                        - &nosniff
                          header: { key: X-Content-Type-Options, value: nosniff }
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                        - &no-referrer
                          header: { key: Referrer-Policy, value: no-referrer }
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                        - &hsts
                          header: { key: Strict-Transport-Security, value: max-age=31536000; includeSubDomains }
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                      routes:
                        # No rate limit: static files, and one page load fetches ~10 ES
                        # modules, which alone would drain the per-IP bucket.
                        - match: { prefix: / }
                          route: { cluster: web }

                    - name: auth
                      domains: [auth.localhost, "auth.localhost:443"]
                      response_headers_to_add:
                        - header: { key: X-Frame-Options, value: SAMEORIGIN }
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                        - *nosniff
                        - *no-referrer
                        - *hsts
                      routes:
                        # Theme assets: the account console loads ~25 in one burst; limiting
                        # them drained the bucket and 429'd the token POST right after.
                        - match: { prefix: /resources/ }
                          route: { cluster: keycloak, append_x_forwarded_host: true }
                        # Login, token and admin endpoints: worth protecting from brute force.
                        # Per-IP limit: the descriptor is (edge, client /24, client IP); the
                        # rate-limit service's config makes the loadtest /24 unlimited.
                        - match: { prefix: / }
                          route:
                            cluster: keycloak
                            append_x_forwarded_host: true
                            rate_limits:
                              - &per-ip-edge
                                actions:
                                  - generic_key: { descriptor_value: edge }
                                  - masked_remote_address: { v4_prefix_mask_len: 24 }
                                  - remote_address: {}

                    - name: api
                      domains: [api.localhost, "api.localhost:443"]
                      # Every api route, /v1/events included, needs a valid Keycloak token.
                      typed_per_filter_config:
                        envoy.filters.http.jwt_authn:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
                          requirement_name: keycloak
                      response_headers_to_add:
                        # CORS for the replies Envoy makes itself (jwt_authn 401, rate-limit 429).
                        # Without them the browser hides the status from JS: "Failed to fetch".
                        # ADD_IF_ABSENT: on upstream responses the service's own CORS headers win;
                        # api and notifier stay the owners of CORS. Origin = x-web-origin in
                        # docker-compose.yml (Envoy can't read compose env): change both.
                        - header: { key: Access-Control-Allow-Origin, value: https://app.localhost }
                          append_action: ADD_IF_ABSENT
                        - header: { key: Access-Control-Expose-Headers, value: Retry-After }
                          append_action: ADD_IF_ABSENT
                        - &frame-deny
                          header: { key: X-Frame-Options, value: DENY }
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                        - *nosniff
                        - *no-referrer
                        - *hsts
                      routes:
                        # Live events (SSE) are served by the notifier, under the api host so
                        # the browser talks to one api origin. Envoy streams responses (no
                        # buffering); the route timeout is off because the stream never
                        # "finishes", and idle_timeout outlives the 25 s heartbeat.
                        - match: { path: /v1/events }
                          route:
                            cluster: notifier
                            timeout: 0s
                            idle_timeout: 3600s
                            rate_limits:
                              - *per-ip-edge
                              # Per user (JWT `sub`), every method: catches one token hammering
                              # GETs, which the api's bucket (writes only) doesn't count. The api
                              # keeps its own write limit (docs/ROADMAP.md, Phase 3).
                              - &per-user
                                stage: 1
                                actions:
                                  - generic_key: { descriptor_value: user }
                                  - metadata:
                                      descriptor_key: sub
                                      metadata_key:
                                        key: envoy.filters.http.jwt_authn
                                        path: [{ key: jwt_payload }, { key: sub }]
                        - match: { prefix: / }
                          route:
                            cluster: api
                            append_x_forwarded_host: true
                            rate_limits: [*per-ip-edge, *per-user]

                    - name: s3
                      domains: [s3.localhost, "s3.localhost:443"]
                      response_headers_to_add: [*nosniff]
                      routes:
                        # Uploads stream straight through (no body size limit, no buffering);
                        # no route timeout, a 200 MB upload can take longer than 15 s.
                        - match: { prefix: / }
                          route:
                            cluster: storage
                            timeout: 0s
                            rate_limits:
                              - actions:
                                  - generic_key: { descriptor_value: s3 }
                                  - masked_remote_address: { v4_prefix_mask_len: 24 }
                                  - remote_address: {}

                    # Unknown host (nginx closed the connection with 444). Also the healthz.
                    - name: default
                      domains: ["*"]
                      response_headers_to_add: [*frame-deny, *nosniff, *no-referrer, *hsts]
                      routes:
                        - match: { path: /healthz }
                          direct_response: { status: 200, body: { inline_string: '{"gateway":"up"}' } }
                        - match: { prefix: / }
                          direct_response: { status: 404 }

  clusters:
    - name: api
      type: STRICT_DNS
      load_assignment:
        cluster_name: api
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: api, port_value: 3000 } } } }] }]
    - name: notifier
      type: STRICT_DNS
      load_assignment:
        cluster_name: notifier
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: notifier, port_value: 3001 } } } }] }]
    - name: keycloak
      type: STRICT_DNS
      load_assignment:
        cluster_name: keycloak
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: keycloak, port_value: 8080 } } } }] }]
    - name: storage
      type: STRICT_DNS
      load_assignment:
        cluster_name: storage
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: storage, port_value: 8333 } } } }] }]
    - name: web
      type: STRICT_DNS
      load_assignment:
        cluster_name: web
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: web, port_value: 80 } } } }] }]
    # The global rate-limit service speaks gRPC, so this one cluster needs HTTP/2.
    - name: ratelimit
      type: STRICT_DNS
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config: { http2_protocol_options: {} }
      load_assignment:
        cluster_name: ratelimit
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: ratelimit, port_value: 8081 } } } }] }]
